name: Release

# Builds Velopack releases for every platform, signs the update feeds, builds the Linux .deb and Flatpak bundle
# (not self-updating; the package manager updates them), and attaches everything to a DRAFT
# GitHub release. Tag pushes only (no manual dispatch), so a release is always tied to a tagged commit.
# The signing key lives in the protected "release" environment and is only exposed to the small sign job,
# which the owner approves (docs/releases/RELEASING.md). Nothing is published automatically.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VPK_VERSION: 1.2.161

jobs:
  pack:
    name: Pack ${{ matrix.rid }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, exe: NinjaLauncher.exe, icon: src/NinjaLauncher.Desktop/Assets/ninja-launcher.ico }
          - { rid: linux-x64, os: ubuntu-latest, exe: NinjaLauncher, icon: src/NinjaLauncher.Desktop/Assets/ninja-launcher.png }
          - { rid: osx-arm64, os: macos-latest, exe: NinjaLauncher, icon: ninja-launcher.icns }
          - { rid: osx-x64, os: macos-15-intel, exe: NinjaLauncher, icon: ninja-launcher.icns }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-pre]"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Require the update public key
        shell: bash
        run: |
          test -f branding/update-signing-key.pub.pem || { echo "::error::branding/update-signing-key.pub.pem is missing; see docs/releases/RELEASING.md"; exit 1; }

      - name: Unit tests
        run: dotnet test --project tests/NinjaLauncher.UnitTests -c Release

      - name: Embed the listed server (private, optional)
        env:
          LISTED_SERVER_JSON: ${{ secrets.LISTED_SERVER_JSON }}
        shell: bash
        run: |
          if [ -n "$LISTED_SERVER_JSON" ]; then printf '%s' "$LISTED_SERVER_JSON" > src/NinjaLauncher.Desktop/listed-server.json; fi

      - name: Publish
        run: dotnet publish src/NinjaLauncher.Desktop -c Release -r ${{ matrix.rid }} --self-contained -p:Version=${{ env.VERSION }} -o publish

      - name: Build macOS icon
        if: startsWith(matrix.rid, 'osx')
        run: |
          mkdir ninja.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s branding/ninja-launcher-logo.png --out ninja.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) branding/ninja-launcher-logo.png --out ninja.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns ninja.iconset -o ninja-launcher.icns

      - name: Pack
        shell: bash
        run: |
          dotnet tool install vpk --version "$VPK_VERSION" --tool-path .vpk
          EXTRA=""
          if [[ "${{ matrix.rid }}" == osx-* ]]; then EXTRA="--bundleId io.github.m0nst3rg.ninjalauncher"; fi
          ./.vpk/vpk pack --packId NinjaLauncher --packVersion "$VERSION" --packDir publish --mainExe "${{ matrix.exe }}" \
            --packTitle "Ninja Launcher" --packAuthors "Ninja Launcher contributors" --channel "${{ matrix.rid }}" \
            --icon "${{ matrix.icon }}" --delta None -o releases $EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.rid }}
          path: releases/*
          if-no-files-found: error

  linux-packages:
    name: Linux .deb (+ Flatpak input)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve version
        id: version
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-pre]"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick desktop-file-utils appstream
      - name: Embed the listed server (private, optional)
        env:
          LISTED_SERVER_JSON: ${{ secrets.LISTED_SERVER_JSON }}
        shell: bash
        run: |
          if [ -n "$LISTED_SERVER_JSON" ]; then printf '%s' "$LISTED_SERVER_JSON" > src/NinjaLauncher.Desktop/listed-server.json; fi

      - name: Publish
        run: dotnet publish src/NinjaLauncher.Desktop -c Release -r linux-x64 --self-contained -p:Version=${{ steps.version.outputs.version }} -o publish
      # Plain publish output, not the Velopack package: the package manager owns updates, so the in-app updater stays off.
      - name: Build and validate the .deb and the Flatpak input
        run: bash packaging/linux/build-packages.sh publish "${{ steps.version.outputs.version }}" artifacts/linux
      - name: Install the .deb (its Depends must resolve)
        run: sudo apt-get install -y ./artifacts/linux/ninja-launcher_*.deb && test -x /usr/bin/ninja-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: distro-deb
          path: artifacts/linux/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-input
          path: artifacts/linux/ninja-launcher-linux-x64.tar.gz
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    needs: linux-packages
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039 # freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-input
          path: artifacts/linux
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: packaging/flatpak/io.github.m0nst3rg.NinjaLauncher.yml
          bundle: ninja-launcher-${{ needs.linux-packages.outputs.version }}-x86_64.flatpak
          branch: stable
          artifact-name: distro-flatpak
          cache: false

  sign:
    name: Sign update feeds
    needs: pack
    runs-on: ubuntu-latest
    # Configure this environment with the owner as required reviewer and a v* tag-only deployment rule.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build signer (no secret in the environment)
        run: dotnet build tools/NinjaLauncher.FeedSigner -c Release
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: unsigned-*
          merge-multiple: true
      - name: Sign and verify
        shell: bash
        env:
          NINJA_FEED_SIGNING_KEY: ${{ secrets.NINJA_FEED_SIGNING_KEY }}
        run: |
          [ -n "$NINJA_FEED_SIGNING_KEY" ] || { echo "::error::Secret NINJA_FEED_SIGNING_KEY is not set in the 'release' environment"; exit 1; }
          dotnet run --project tools/NinjaLauncher.FeedSigner -c Release --no-build -- sign dist/releases.*.json
          dotnet run --project tools/NinjaLauncher.FeedSigner -c Release --no-build -- verify branding/update-signing-key.pub.pem dist/releases.*.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/*
          if-no-files-found: error

  draft:
    name: Draft GitHub release
    needs: [sign, linux-packages, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: distro-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "${{ github.repository }}" --verify-tag --draft --title "Ninja Launcher $V" \
            --notes "Unsigned builds (no Authenticode / Apple notarisation yet). Verify downloads with SHA256SUMS.txt. NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT."
