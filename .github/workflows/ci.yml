name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, rid: win-x64 }
          - { name: Linux x64, os: ubuntu-latest, rid: linux-x64 }
          - { name: macOS ARM64, os: macos-latest, rid: osx-arm64 }
          - { name: macOS x64, os: macos-15-intel, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build NinjaLauncher.slnx -c Release
      - name: Unit tests
        run: dotnet test --project tests/NinjaLauncher.UnitTests -c Release --no-build
      - name: Platform tests
        run: dotnet test --project tests/NinjaLauncher.PlatformTests -c Release --no-build
      - name: Integration tests (live public APIs, no credentials)
        if: matrix.rid == 'linux-x64'
        run: dotnet test --project tests/NinjaLauncher.IntegrationTests -c Release --no-build
      - name: Publish (self-contained, unsigned)
        run: dotnet publish src/NinjaLauncher.Desktop -c Release -r ${{ matrix.rid }} --self-contained -o publish/${{ matrix.rid }}
      - name: Verify publish output
        shell: bash
        run: |
          test -f publish/${{ matrix.rid }}/NinjaLauncher || test -f publish/${{ matrix.rid }}/NinjaLauncher.exe
      - name: Packaging validation (Velopack, unsigned feed)
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path .vpk
          ./.vpk/vpk pack --packId NinjaLauncher --packVersion 0.0.1-ci --packDir publish/win-x64 --mainExe NinjaLauncher.exe \
            --channel win-x64 --icon src/NinjaLauncher.Desktop/Assets/ninja-launcher.ico --delta None -o vpk-out
          test -f vpk-out/releases.win-x64.json && test -f vpk-out/NinjaLauncher-win-x64-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NinjaLauncher-${{ matrix.rid }}-unsigned
          path: publish/${{ matrix.rid }}
          retention-days: 7

  linux-packages:
    name: Linux .deb (+ Flatpak input)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick desktop-file-utils appstream
      - name: Publish (self-contained)
        run: dotnet publish src/NinjaLauncher.Desktop -c Release -r linux-x64 --self-contained -o publish/linux-x64
      - name: Build and validate the .deb and the Flatpak input
        run: bash packaging/linux/build-packages.sh publish/linux-x64 0.0.1-ci artifacts/linux
      - name: Install the .deb (its Depends must resolve)
        run: |
          sudo apt-get install -y ./artifacts/linux/ninja-launcher_*.deb
          test -x /usr/bin/ninja-launcher && test -x /opt/ninja-launcher/NinjaLauncher
          sudo apt-get remove -y ninja-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: distro-deb
          path: artifacts/linux/*.deb
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-input
          path: artifacts/linux/ninja-launcher-linux-x64.tar.gz
          retention-days: 1

  flatpak:
    name: Flatpak
    needs: linux-packages
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-input
          path: artifacts/linux
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.m0nst3rg.NinjaLauncher.yml
          bundle: ninja-launcher-ci-x86_64.flatpak
          artifact-name: distro-flatpak
          cache: false
